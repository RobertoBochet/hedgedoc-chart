name: "Publish chart"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-chart:
    name: "Build chart"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set chart version
        run: |
          VERSION="${GITHUB_REF/refs\/tags\//}"
          VERSION="${VERSION/v/}"
          sed -i "s|^version:.*|version:\ \"${VERSION}\"|g" Chart.yaml
      - name: Helm tool installer
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Build chart
        run: |
          helm dependency update
          helm package .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charts
          path: "*.tgz"

  publish-chart:
    name: "Publish chart to owner repository"
    runs-on: ubuntu-latest
    needs: build-chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: '${{ github.repository_owner }}/charts'
          ref: 'charts'
          token: '${{ secrets.CHARTS_REPO_TOKEN }}'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: charts
      - name: Push chart
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add *.tgz
          export CHART_FILENAMES="$(git --no-pager diff --name-only --cached -- '*.tgz' | tr '\n' ' ')"
          git commit -m "Add ${CHART_FILENAMES}"
          git push origin charts

  create-release:
    name: "Create release on GitHub"
    runs-on: ubuntu-latest
    needs: build-chart
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: charts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "*.tgz"
          generate_release_notes: true
          make_latest: true
